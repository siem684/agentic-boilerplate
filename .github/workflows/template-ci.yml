name: Template CI

# Tests of the template's own scripts. This file belongs to the template repository only:
# `node scripts/init.mjs` deletes it in a spawned project (scripts/placeholders.mjs).

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    # Only the template repository is marked as a template; spawned repositories are not.
    if: ${{ github.event.repository.is_template == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Test the template scripts
        run: node --test "tests/**/*.test.mjs"
