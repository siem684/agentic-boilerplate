name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # Post-hoc cost alert per run (ADR 0003)
      MAX_COST_USD: ${{ vars.MAX_COST_USD_DEV || '5' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Trim skills to the CI set
        run: node scripts/trim-skills.mjs bmad-agent-dev bmad-build bmad-qa-generate-e2e-tests bmad-code-review

      # Model choice per issue (ADR 0002, ADR 0007). Label `dev:deepseek` is opt-in and still a pilot.
      - name: Select model
        id: model
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }} ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DEV_MODEL: ${{ vars.DEV_MODEL || 'claude-opus-5-5' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/anthropic' }}
          HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if echo "$LABELS" | grep -q '"dev:deepseek"'; then
            if [ "$HAS_DEEPSEEK_KEY" != "true" ]; then
              echo "::error::Label dev:deepseek is set but the DEEPSEEK_API_KEY secret is missing. Refusing to fall back to ANTHROPIC_API_KEY."
              exit 1
            fi
            echo "model=$DEEPSEEK_MODEL" >> "$GITHUB_OUTPUT"
            echo "provider=deepseek" >> "$GITHUB_OUTPUT"
            # Undocumented for claude-code-action; verify in the pilot (ADR 0007).
            echo "ANTHROPIC_BASE_URL=$DEEPSEEK_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "model=$DEV_MODEL" >> "$GITHUB_OUTPUT"
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        id: claude
        with:
          anthropic_api_key: ${{ steps.model.outputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || steps.model.outputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          # The review job (ci.yml) posts an @claude mention for one automated fix round.
          allowed_bots: "claude"
          claude_args: |
            --agent claude-dev
            --model ${{ steps.model.outputs.model }}
            --max-turns 40
            --allowedTools "Bash(gh issue create:*),Bash(gh label create:*),Bash(gh label list:*),Bash(gh pr create:*),Bash(gh issue edit:*),Bash(gh pr edit:*),Bash(npx:*),Bash(node:*),Bash(npm:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*)"

      - name: Telemetry
        id: telemetry
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/telemetry.mjs "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" "claude-dev:${{ steps.model.outputs.model }}"

      - name: Report budget overrun
        if: always() && steps.telemetry.outputs.over_budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Run cost exceeded the budget of $MAX_COST_USD USD. See the step summary of run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-claude-${{ github.run_id }}
          path: |
            telemetry.jsonl
            ${{ runner.temp }}/claude-execution-output.json

          retention-days: 30
          if-no-files-found: ignore
