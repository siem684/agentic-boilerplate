name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Replace the steps below with the project's checks in CLAUDE.md.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Run checks
        run: |
          {{CHECK_COMMANDS}}

  review:
    # Fork PRs get no secrets; only branches of this repository are reviewed.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/') && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Trim skills to the CI set
        run: node scripts/trim-skills.mjs bmad-agent-dev bmad-build bmad-qa-generate-e2e-tests bmad-code-review

      # Loop protection is counted here, not by the model: it only reads the number.
      - name: Count earlier automated reviews
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          n=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body | startswith("<!-- claude-review -->"))] | length')
          echo "previous=$n" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR's are being opened by claude[bot]; without this the action will refuse the run.
          allowed_bots: "claude,github-actions"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PREVIOUS_REVIEWS: ${{ steps.rounds.outputs.previous }}

            You are an independent code reviewer. You did NOT write this change; be critical and concrete.
            Do not change any files. Read CLAUDE.md for the project rules.

            1. Collect diff and description with `gh pr view` and `gh pr diff`; read the associated issue.
            2. Use the review lenses of the bmad-code-review skill (blind hunter, edge cases, acceptance auditor) if they are available. 
               If not, review yourself on the points below. Report one combined result and do not ask questions.
            3. Check whether the change meets the issue's acceptance criteria and stays in scope.
               Check the quality of the tests: do they really test the behaviour, and was test-first followed?
               Check that the diff is small and has no unrelated changes, and that no protected path is touched.
               Check the project-specific rules in CLAUDE.md and docs/adr/.
            4. Post exactly one review with gh pr comment, starting with the line <!-- claude-review -->, with the headings "Blocking" and "Suggestions" 
               (file:line, what is wrong, proposed fix). No filler praise. If there are no blocking points, say so explicitly.
            5. Loop protection: PREVIOUS_REVIEWS above is the number of earlier <!-- claude-review --> comments on this PR.
               If PREVIOUS_REVIEWS is 0 and there are blocking points, end your comment with the line @claude please fix the blocking findings above.
               If PREVIOUS_REVIEWS is 1 or more, do NOT mention @claude; ask the maintainer to take a look.
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Skill,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*)"

      - name: Telemetry
        id: telemetry
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MAX_COST_USD: ${{ vars.MAX_COST_USD_REVIEW || '1' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: node scripts/telemetry.mjs "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" "review:${REVIEW_MODEL}"

      - name: Report budget overrun
        if: always() && steps.telemetry.outputs.over_budget == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Review cost exceeded the review budget (the check runs after the review has finished). See the step summary of run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-review-${{ github.run_id }}
          path: telemetry.jsonl
          retention-days: 30
          if-no-files-found: ignore
